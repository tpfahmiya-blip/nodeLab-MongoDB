<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NodeLab | Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

        }


        .dashboard-card {

            width: 500px;

            max-width: 100%;

            background: white;

            border-radius: 18px;

            padding: 45px;

            text-align: center;

            box-shadow:
                0 20px 45px
                rgba(0, 0, 0, 0.25);

        }


        /* =========================
           SUCCESS ICON
           ========================= */

        .success-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #e8f8ee;

            color: #28a745;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 38px;

            font-weight: bold;

        }


        /* =========================
           TEXT
           ========================= */

        h1 {

            margin: 0;

            color: #333;

            font-size: 30px;

        }


        .subtitle {

            color: #777;

            font-size: 16px;

            margin-top: 12px;

            margin-bottom: 30px;

        }


        .info-box {

            background: #f5f6ff;

            border-left: 4px solid #667eea;

            padding: 15px;

            border-radius: 8px;

            color: #555;

            margin-bottom: 30px;

        }


        /* =========================
           LOGOUT BUTTON
           ========================= */

        .logout-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #dc3545,
                    #c82333
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s;

        }


        .logout-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 6px 15px
                rgba(220, 53, 69, 0.3);

        }


        .logout-button:active {

            transform: translateY(0);

        }


        /* =========================
           FOOTER
           ========================= */

        .footer {

            margin-top: 25px;

            color: #aaa;

            font-size: 13px;

        }

    </style>

</head>


<body>


    <div class="dashboard-card">


        <!-- SUCCESS ICON -->

        <div class="success-icon">
            ✓
        </div>


        <!-- WELCOME -->

        <h1 id="welcomeMessage">
            Welcome!
        </h1>


        <p class="subtitle">
            You have successfully logged in.
        </p>


        <div class="info-box">

            Your account is connected to
            <strong>MongoDB</strong>.

        </div>


        <!-- LOGOUT -->

        <button
            id="logoutButton"
            class="logout-button"
        >
            Log Out
        </button>


        <div class="footer">

            NodeLab &copy; 2026

        </div>


    </div>


    <script>


        // ==================================
        // GET USER NAME
        // ==================================

        const userName =
            localStorage.getItem("userName");


        // ==================================
        // CHECK LOGIN
        // ==================================

        if (!userName) {

            window.location.href =
                "index.html";

        }

        else {

            document.getElementById(
                "welcomeMessage"
            ).textContent =
                `Welcome, ${userName}!`;

        }


        // ==================================
        // LOGOUT
        // ==================================

        document
            .getElementById("logoutButton")
            .addEventListener(
                "click",
                function() {


                    // Remove stored user
                    localStorage.removeItem(
                        "userName"
                    );


                    // Go back to login
                    window.location.href =
                        "index.html";

                }
            );

    </script>


</body>

</html>
