<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NodeLab | Login & Sign Up</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

        }


        .main-container {

            width: 900px;

            max-width: 100%;

        }


        /* =========================
           HEADER
           ========================= */

        .header {

            text-align: center;

            color: white;

            margin-bottom: 30px;

        }


        .header h1 {

            margin: 0;

            font-size: 38px;

            letter-spacing: 1px;

        }


        .header p {

            margin-top: 10px;

            font-size: 16px;

            opacity: 0.9;

        }


        /* =========================
           FORM CONTAINER
           ========================= */

        .forms-container {

            display: flex;

            gap: 25px;

        }


        /* =========================
           CARDS
           ========================= */

        .form-card {

            background: white;

            flex: 1;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, 0.2);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

        }


        .form-card:hover {

            transform: translateY(-6px);

            box-shadow:
                0 20px 40px
                rgba(0, 0, 0, 0.25);

        }


        /* =========================
           CARD HEADINGS
           ========================= */

        .form-card h2 {

            margin-top: 0;

            margin-bottom: 8px;

            font-size: 26px;

        }


        .signup-card h2 {

            color: #667eea;

        }


        .login-card h2 {

            color: #764ba2;

        }


        .form-description {

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;

        }


        /* =========================
           LABELS
           ========================= */

        label {

            display: block;

            margin-bottom: 7px;

            color: #444;

            font-weight: bold;

            font-size: 14px;

        }


        /* =========================
           INPUTS
           ========================= */

        input {

            width: 100%;

            padding: 13px 14px;

            margin-bottom: 18px;

            border: 2px solid #e5e5e5;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.3s,
                box-shadow 0.3s;

        }


        input:focus {

            border-color: #667eea;

            box-shadow:
                0 0 0 3px
                rgba(102, 126, 234, 0.15);

        }


        /* =========================
           BUTTONS
           ========================= */

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s;

        }


        .signup-button {

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #536dfe
                );

        }


        .login-button {

            background:
                linear-gradient(
                    135deg,
                    #764ba2,
                    #9c4dcc
                );

        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 6px 15px
                rgba(0, 0, 0, 0.2);

        }


        button:active {

            transform: translateY(0);

        }


        /* =========================
           MESSAGES
           ========================= */

        .message {

            min-height: 22px;

            margin-top: 15px;

            text-align: center;

            font-size: 14px;

            font-weight: bold;

        }


        /* =========================
           FOOTER
           ========================= */

        .footer {

            text-align: center;

            color: white;

            margin-top: 25px;

            font-size: 13px;

            opacity: 0.8;

        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 700px) {

            body {

                padding: 20px;

                align-items: flex-start;

            }


            .forms-container {

                flex-direction: column;

            }


            .header h1 {

                font-size: 30px;

            }


            .form-card {

                padding: 25px;

            }

        }

    </style>

</head>


<body>


    <div class="main-container">


        <!-- HEADER -->

        <div class="header">

            <h1>Welcome to NodeLab</h1>

            <p>
                Simple and secure user authentication
            </p>

        </div>


        <!-- FORMS -->

        <div class="forms-container">


            <!-- =========================
                 SIGN UP
                 ========================= -->

            <div class="form-card signup-card">

                <h2>Create Account</h2>

                <p class="form-description">
                    Sign up to create your NodeLab account.
                </p>


                <form id="signupForm">


                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required
                    >


                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="submit"
                        class="signup-button"
                    >
                        Create Account
                    </button>

                </form>


                <div
                    id="signupMessage"
                    class="message"
                ></div>

            </div>


            <!-- =========================
                 LOGIN
                 ========================= -->

            <div class="form-card login-card">

                <h2>Welcome Back</h2>

                <p class="form-description">
                    Login to access your dashboard.
                </p>


                <form id="loginForm">


                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="submit"
                        class="login-button"
                    >
                        Login
                    </button>

                </form>


                <div
                    id="loginMessage"
                    class="message"
                ></div>

            </div>

        </div>


        <div class="footer">

            NodeLab &copy; 2026

        </div>


    </div>


    <script>


        // ==================================
        // SIGN UP
        // ==================================

        document
            .getElementById("signupForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const name =
                        document.getElementById(
                            "signupName"
                        ).value;


                    const email =
                        document.getElementById(
                            "signupEmail"
                        ).value;


                    const password =
                        document.getElementById(
                            "signupPassword"
                        ).value;


                    const message =
                        document.getElementById(
                            "signupMessage"
                        );


                    try {

                        const response =
                            await fetch(
                                "/signup",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            name: name,
                                            email: email,
                                            password: password
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        message.textContent =
                            data.message;


                        if (data.success) {

                            message.style.color =
                                "#28a745";


                            document
                                .getElementById(
                                    "signupForm"
                                )
                                .reset();

                        }

                        else {

                            message.style.color =
                                "#dc3545";

                        }

                    }

                    catch (error) {

                        console.error(error);

                        message.textContent =
                            "Unable to connect to server.";

                        message.style.color =
                            "#dc3545";

                    }

                }
            );


        // ==================================
        // LOGIN
        // ==================================

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const email =
                        document.getElementById(
                            "loginEmail"
                        ).value;


                    const password =
                        document.getElementById(
                            "loginPassword"
                        ).value;


                    const message =
                        document.getElementById(
                            "loginMessage"
                        );


                    try {

                        const response =
                            await fetch(
                                "/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            email: email,
                                            password: password
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        message.textContent =
                            data.message;


                        if (data.success) {

                            message.style.color =
                                "#28a745";


                            // Save user's name
                            localStorage.setItem(
                                "userName",
                                data.name
                            );


                            // Redirect to dashboard
                            setTimeout(
                                function() {

                                    window.location.href =
                                        "dashboard.html";

                                },
                                500
                            );

                        }

                        else {

                            message.style.color =
                                "#dc3545";

                        }

                    }

                    catch (error) {

                        console.error(error);

                        message.textContent =
                            "Unable to connect to server.";

                        message.style.color =
                            "#dc3545";

                    }

                }
            );

    </script>


</body>

</html>
